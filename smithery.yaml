# Smithery (stdio, runs locally via npx). Submit at release time, see RELEASING.md.
startCommand:
  type: stdio
  configSchema:
    type: object
    required: [flipziApiKey]
    properties:
      flipziApiKey: { type: string, description: "Your Flipzi Data API key (fz_live_...). Free plan: https://flipzi.io/account/register?product=data" }
  commandFunction: |-
    (config) => ({ command: 'npx', args: ['-y', 'flipzi-mcp'], env: { FLIPZI_API_KEY: config.flipziApiKey } })
